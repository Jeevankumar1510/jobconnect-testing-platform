databases:
  - name: jobconnect-db
    databaseName: jobconnect
    user: jobconnect
    plan: free
    region: singapore

services:
  - type: web
    name: jobconnect-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py bootstrap_admin && python manage.py sync_jobs --limit 30 && exec uvicorn api.main:app --host 0.0.0.0 --port "$PORT"'
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobconnect-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: jobconnect-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: jobconnect-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: jobconnect-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: jobconnect-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: jobconnect-db
          property: port
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RESUME_STORAGE_DIR
        value: /app/media/resumes
      - key: MAX_RESUME_SIZE_BYTES
        value: "5242880"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@jobconnect.local
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

  - type: web
    name: jobconnect-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: API_BASE_URL
        value: https://jobconnect-api.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
